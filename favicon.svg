<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="warm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb870"/>
      <stop offset="55%" stop-color="#f08a3c"/>
      <stop offset="100%" stop-color="#c25a1c"/>
    </linearGradient>
    <radialGradient id="petal" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff3d0"/>
      <stop offset="55%" stop-color="#ffcf88"/>
      <stop offset="100%" stop-color="#e88a3a"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#soft)">
    <!-- Сердце -->
    <path d="M50 88
             C 22 68, 10 52, 10 36
             C 10 20, 22 10, 34 10
             C 42 10, 48 15, 50 22
             C 52 15, 58 10, 66 10
             C 78 10, 90 20, 90 36
             C 90 52, 78 68, 50 88 Z"
          fill="url(#warm)"/>

    <!-- Цветок с пятью лепестками в центре -->
    <g transform="translate(50 50)">
      <!-- Пять лепестков: каждый — эллипс, повёрнутый на 72° -->
      <ellipse cx="0" cy="-9" rx="4.5" ry="7.5" fill="url(#petal)" transform="rotate(0)"/>
      <ellipse cx="0" cy="-9" rx="4.5" ry="7.5" fill="url(#petal)" transform="rotate(72)"/>
      <ellipse cx="0" cy="-9" rx="4.5" ry="7.5" fill="url(#petal)" transform="rotate(144)"/>
      <ellipse cx="0" cy="-9" rx="4.5" ry="7.5" fill="url(#petal)" transform="rotate(216)"/>
      <ellipse cx="0" cy="-9" rx="4.5" ry="7.5" fill="url(#petal)" transform="rotate(288)"/>
      <!-- Сердцевина цветка -->
      <circle cx="0" cy="0" r="3" fill="#fff3d0"/>
    </g>
  </g>
</svg>
