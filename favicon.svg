<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g stroke="#8fd4f5" stroke-width="2" stroke-linecap="round" fill="none" filter="url(#glow)">
    <!-- Шесть главных лучей -->
    <line x1="50" y1="6" x2="50" y2="94"/>
    <line x1="11.9" y1="28" x2="88.1" y2="72"/>
    <line x1="11.9" y1="72" x2="88.1" y2="28"/>

    <!-- Веточки на вертикальном луче (верх) -->
    <line x1="50" y1="20" x2="41" y2="28"/>
    <line x1="50" y1="20" x2="59" y2="28"/>
    <line x1="50" y1="32" x2="44" y2="37"/>
    <line x1="50" y1="32" x2="56" y2="37"/>

    <!-- Веточки на вертикальном луче (низ) -->
    <line x1="50" y1="80" x2="41" y2="72"/>
    <line x1="50" y1="80" x2="59" y2="72"/>
    <line x1="50" y1="68" x2="44" y2="63"/>
    <line x1="50" y1="68" x2="56" y2="63"/>

    <!-- Веточки на луче «верх-право» (30°) -->
    <line x1="64" y1="22" x2="60" y2="32"/>
    <line x1="64" y1="22" x2="71" y2="23"/>
    <line x1="74" y1="33" x2="72" y2="41"/>
    <line x1="74" y1="33" x2="79" y2="36"/>

    <!-- Веточки на луче «низ-право» (150°) -->
    <line x1="64" y1="78" x2="60" y2="68"/>
    <line x1="64" y1="78" x2="71" y2="77"/>
    <line x1="74" y1="67" x2="72" y2="59"/>
    <line x1="74" y1="67" x2="79" y2="64"/>

    <!-- Веточки на луче «верх-лево» (150°) -->
    <line x1="36" y1="22" x2="40" y2="32"/>
    <line x1="36" y1="22" x2="29" y2="23"/>
    <line x1="26" y1="33" x2="28" y2="41"/>
    <line x1="26" y1="33" x2="21" y2="36"/>

    <!-- Веточки на луче «низ-лево» (30°) -->
    <line x1="36" y1="78" x2="40" y2="68"/>
    <line x1="36" y1="78" x2="29" y2="77"/>
    <line x1="26" y1="67" x2="28" y2="59"/>
    <line x1="26" y1="67" x2="21" y2="64"/>
  </g>

  <!-- Центральный шестиугольник -->
  <g stroke="#a8e0f8" stroke-width="1.6" fill="none">
    <polygon points="50,44 55.2,47 55.2,53 50,56 44.8,53 44.8,47"/>
  </g>

  <!-- Маленькие точки на концах лучей — как иней -->
  <g fill="#c8ecff">
    <circle cx="50" cy="6" r="1.6"/>
    <circle cx="50" cy="94" r="1.6"/>
    <circle cx="11.9" cy="28" r="1.6"/>
    <circle cx="88.1" cy="72" r="1.6"/>
    <circle cx="11.9" cy="72" r="1.6"/>
    <circle cx="88.1" cy="28" r="1.6"/>
  </g>

  <!-- Точка в центре -->
  <circle cx="50" cy="50" r="1.4" fill="#ffffff"/>
</svg>
